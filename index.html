<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AVIATOR V20 - OFFICIEL</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; }
        .screen { display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; width: 100%; max-width: 400px; }
        .active { display: flex; }
        .card { background: #0d0d0d; padding: 25px; border-radius: 20px; border: 1px solid #222; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { text-align: center; color: #f00; margin-bottom: 20px; letter-spacing: 2px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; text-align: center; font-size: 16px; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: #f00; color: #fff; transition: 0.3s; margin-bottom: 10px; }
        .btn:active { transform: scale(0.98); }
        .btn-outline { background: none; border: 1px solid #f00; color: #f00; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; width: 100%; }
        .tab { flex: 1; padding: 12px; background: #111; text-align: center; border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: bold; border: 1px solid #222; }
        .tab.active { background: #f00; border-color: #f00; }
        .panel { display: none; width: 100%; animation: fadeIn 0.4s ease; }
        .panel.active { display: block; }
        .dot-row { display: flex; gap: 8px; justify-content: center; margin: 15px 0; }
        .dot { width: 45px; height: 45px; background: #111; border: 1px solid #f00; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .res-box { padding: 12px; border-radius: 10px; text-align: center; font-size: 13px; font-weight: bold; }
        .blue { background: linear-gradient(135deg, #003366, #0055aa); border: 1px solid #0088ff; }
        .rose { background: linear-gradient(135deg, #440022, #770033); border: 1px solid #ff0055; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="card">
            <h2 id="log-title">AVIATOR V20</h2>
            <input type="email" id="l-email" placeholder="Email">
            <input type="password" id="l-pass" placeholder="Password">
            
            <button class="btn" onclick="loginEmail()">SE CONNECTER</button>
            <button class="btn btn-outline" onclick="registerEmail()">S'INSCRIRE</button>
            
            <div style="margin: 10px 0; color: #444; text-align: center; font-size: 12px;">OU</div>
            
            <button class="btn" onclick="loginGoogle()" style="background: #fff; color: #000; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google
            </button>
        </div>
    </div>

    <div id="app-screen" class="screen" style="justify-content: flex-start; padding-top: 40px;">
        <div class="tabs">
            <div id="t-sig" class="tab active" onclick="switchTab('sig')">STRAT EMOJI</div>
            <div id="t-cot" class="tab" onclick="switchTab('cot')">STRAT COTE</div>
        </div>

        <div id="p-sig" class="panel active">
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <button class="btn" style="background:#001a33; border:1px solid #0088ff;" onclick="addEmoji('💙')">💙</button>
                <button class="btn" style="background:#1a0033; border:1px solid #8800ff;" onclick="addEmoji('💜')">💜</button>
                <button class="btn" style="background:#330000; border:1px solid #ff0000;" onclick="addEmoji('🌹')">🌹</button>
            </div>
            <div class="dot-row">
                <div class="dot" id="dot-0"></div><div class="dot" id="dot-1"></div><div class="dot" id="dot-2"></div><div class="dot" id="dot-3"></div><div class="dot" id="dot-4"></div>
            </div>
            <input type="time" id="time-sig" step="1" onchange="runCalc()">
            <div id="res-sig" class="res-grid"></div>
            <button class="btn" style="background:#222; margin-top:20px; font-size:12px;" onclick="resetSig()">RESET</button>
        </div>

        <div id="p-cot" class="panel">
            <input type="number" id="val-cot" placeholder="Cote reçue" step="0.01">
            <input type="time" id="time-cot" step="1" onchange="runCote()">
            <div id="res-cot" class="res-grid"></div>
        </div>
        
        <button onclick="logout()" style="margin-top:auto; background:none; border:none; color:#555; cursor:pointer; padding:20px;">Déconnexion</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC0Icj3B1W9RpWIueRJqrpcdoFbGSb4Nvs",
        authDomain: "aviator-85380.firebaseapp.com",
        databaseURL: "https://aviator-85380-default-rtdb.firebaseio.com",
        projectId: "aviator-85380",
        storageBucket: "aviator-85380.firebasestorage.app",
        messagingSenderId: "206580715363",
        appId: "1:206580715363:web:79b0d5cb883e840e590d56"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // --- FONCTIONS AUTH ---
    function loginEmail() {
        const e = document.getElementById("l-email").value, p = document.getElementById("l-pass").value;
        auth.signInWithEmailAndPassword(e, p).catch(err => alert("Erreur: " + err.message));
    }

    function registerEmail() {
        const e = document.getElementById("l-email").value, p = document.getElementById("l-pass").value;
        if(p.length < 6) { alert("Le mot de passe doit faire 6 caractères minimum"); return; }
        auth.createUserWithEmailAndPassword(e, p)
            .then(() => alert("Compte créé avec succès ! Connectez-vous."))
            .catch(err => alert("Erreur d'inscription: " + err.message));
    }

    function loginGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithRedirect(provider); // Plus stable sur mobile
    }

    function logout() { auth.signOut(); }

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('app-screen').classList.add('active');
        } else {
            document.getElementById('login-screen').classList.add('active');
            document.getElementById('app-screen').classList.remove('active');
        }
    });

    // --- NAVIGATION & LOGIQUE ---
    function switchTab(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('p-'+id).classList.add('active');
        document.getElementById('t-'+id).classList.add('active');
    }

    let currentSeq = [];
    const patterns = {
        "💙💜🌹💙💙": [{m:3, c:"x60", s:"blue"}, {m:7, c:"x25", s:"rose"}],
        "💙💜🌹💙💜": [{m:8, c:"x15", s:"blue"}, {m:13, c:"x70", s:"rose"}],
        "💜💙🌹💙💜": [{m:3, c:"x25", s:"rose"}, {m:11, c:"x30", s:"blue"}],
        "💜💙🌹💙💙": [{m:3, c:"x70", s:"rose"}, {m:8, c:"x200", s:"rose"}],
        "💜💜🌹💙💜": [{m:7, c:"x20", s:"blue"}, {m:9, c:"x300", s:"rose"}],
        "💜💙🌹💜💜": [{m:3, c:"x10", s:"blue"}, {m:10, c:"x20", s:"blue"}],
        "💙💙🌹💜💜": [{m:9, c:"x10", s:"blue"}, {m:13, c:"x30", s:"blue"}],
        "💜💜🌹💜💙": [{m:5, c:"x50", s:"rose"}, {m:21, c:"x10", s:"rose"}],
        "💙💙🌹💙💙": [{m:3, c:"x400", s:"gold"}, {m:17, c:"x50", s:"rose"}],
        "💜💙🌹💜💙": [{m:7, c:"x50", s:"rose"}, {m:13, c:"x100", s:"rose"}],
        "💙💙🌹💙💜": [{m:3, c:"x80", s:"rose"}, {m:25, c:"x3000", s:"gold"}],
        "💙💜🌹💜💙": [{m:3, c:"x50", s:"blue"}, {m:10, c:"x150", s:"rose"}]
    };

    function addEmoji(emoji) {
        if(currentSeq.length >= 5) resetSig();
        document.getElementById('dot-' + currentSeq.length).innerHTML = emoji;
        currentSeq.push(emoji);
        if(currentSeq.length === 5) runCalc();
    }
    function resetSig() {
        currentSeq = [];
        for(let i=0; i<5; i++) document.getElementById('dot-'+i).innerHTML = "";
        document.getElementById('res-sig').innerHTML = "";
    }
    function runCalc() {
        const time = document.getElementById("time-sig").value, grid = document.getElementById("res-sig");
        if(!time || currentSeq.length < 5) return;
        const res = patterns[currentSeq.join('')];
        display(time, res || [], grid);
    }
    function runCote() {
        const val = parseFloat(document.getElementById("val-cot").value), time = document.getElementById("time-cot").value, grid = document.getElementById("res-cot");
        if(!val || !time) return;
        let s = [];
        if (val >= 2.5 && val <= 3.5) s.push({m: 2.16, c: "X3 IZY", s: "blue"});
        else if (val >= 4.5 && val <= 6.5) s.push({m: 4.16, c: "X5 FAKANA", s: "rose"});
        else if (val >= 6.5 && val <= 9.99) { s.push({m: 6.16, c: "X3 ASSURÉ", s: "blue"}); s.push({m: 12.3, c: "X10 ROSE", s: "rose"}); }
        display(time, s, grid);
    }
    function display(ts, list, container) {
        if(list.length === 0) { container.innerHTML = "<p style='grid-column:1/3; font-size:11px; color:#444; text-align:center;'>Aucun signal</p>"; return; }
        const [h, m, sec] = ts.split(':').map(Number);
        container.innerHTML = list.map(i => {
            let d = new Date(); d.setHours(h, m, (sec || 0) + (i.m * 60));
            return `<div class="res-box ${i.s}"><b>${i.c}</b><br>${d.toLocaleTimeString('fr-FR')}</div>`;
        }).join('');
    }
</script>
</body>
</html>
