<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AVIATOR RNG PREDICTOR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:system-ui,Arial;
  background:linear-gradient(135deg,#0ea5e9,#ef4444);
  color:#fff;
}
.app{
  max-width:420px;
  margin:auto;
  padding:16px;
}
.card{
  background:rgba(0,0,0,0.55);
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 0 0 1px rgba(255,255,255,0.1);
}
h2,h3{margin:0 0 10px}
input,button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:none;
  font-size:15px;
}
input{background:#020617;color:#fff}
button{background:#22c55e;color:#000;font-weight:600}
button.red{background:#ef4444;color:#fff}
button.gray{background:#94a3b8}
.small{font-size:12px;opacity:.8}
.pred{
  font-size:20px;
  margin:6px 0;
}
.good{color:#22c55e}
.warn{color:#facc15}
.bad{color:#f87171}
.progress{
  height:10px;
  background:#020617;
  border-radius:6px;
  overflow:hidden;
}
.bar{
  height:100%;
  background:linear-gradient(90deg,#22c55e,#38bdf8);
  width:0%;
}
</style>
</head>

<body>
<div class="app">

<div class="card">
  <h2>AVIATOR RNG PREDICTOR</h2>
  <div class="small">Simulateur • Analyse temps • Auto-apprentissage</div>
</div>

<div class="card">
  <input id="hour" type="number" placeholder="Heure (0-23)">
  <input id="minute" type="number" placeholder="Minute (0-59)">
  <input id="second" type="number" placeholder="Seconde (0-59)">
  <input id="last" type="number" step="0.01" placeholder="Dernier ROSE (≥4.00)">
  <button onclick="predict()">Analyser</button>
</div>

<div class="card" id="out" style="display:none">
  <h3>Prédictions</h3>
  <div id="list"></div>
  <div class="small" id="range"></div>
</div>

<div class="card">
  <button onclick="record(true)">GAGNÉ</button>
  <button class="red" onclick="record(false)">PERDU</button>
</div>

<div class="card">
  <h3>Progression IA</h3>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="small" id="stats"></div>
  <button class="gray" onclick="resetStats()">Reset stats</button>
</div>

</div>

<script>
/* ========= IA STOCKÉE ========= */
let IA = JSON.parse(localStorage.getItem("aviatorIA")) || {
  wins:0,
  losses:0,
  wTime:1,
  wChaos:1,
  bias:0.5
};
let lastPreds=[];

/* ========= RNG & MATH ========= */
function chaos(seed){
  return Math.abs(Math.sin(seed*12.9898)*43758.5453)%1;
}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

/* ========= PREDICTION ========= */
function predict(){
  const h=+hour.value,m=+minute.value,s=+second.value,last=+last.value;
  if(
    isNaN(h)||isNaN(m)||isNaN(s)||isNaN(last)||
    h<0||h>23||m<0||m>59||s<0||s>59||last<4
  ){
    alert("Valeurs invalides");
    return;
  }

  lastPreds=[];
  let base = (h/24 + m/60 + s/60) * IA.wTime;
  let noise = chaos(Date.now()) * IA.wChaos;
  let history = (IA.wins-IA.losses) * 0.02;
  let core = last*0.15 + base + noise + history + IA.bias;

  let min=999,max=0;
  for(let i=0;i<4;i++){
    let seed = core + chaos(i+Date.now());
    let v = clamp(seed*5,1.2,20);
    lastPreds.push(v.toFixed(2));
    min=Math.min(min,v);
    max=Math.max(max,v);
  }

  list.innerHTML = lastPreds.map(p=>
    `<div class="pred">${p}x</div>`
  ).join("");
  range.innerText=`Estimation: ${min.toFixed(2)}x → ${max.toFixed(2)}x`;
  out.style.display="block";
}

/* ========= APPRENTISSAGE ========= */
function record(win){
  if(!lastPreds.length) return;
  if(win){
    IA.wins++;
    IA.wTime+=0.03;
    IA.bias+=0.02;
  }else{
    IA.losses++;
    IA.wChaos+=0.03;
    IA.bias-=0.02;
  }
  IA.bias=clamp(IA.bias,-1,1);
  save();
}

/* ========= UI ========= */
function save(){
  localStorage.setItem("aviatorIA",JSON.stringify(IA));
  let total=IA.wins+IA.losses||1;
  let rate=Math.round((IA.wins/total)*100);
  bar.style.width=rate+"%";
  stats.innerText=`Gagné: ${IA.wins} | Perdu: ${IA.losses} | Taux IA: ${rate}%`;
}
function resetStats(){
  IA.wins=0;IA.losses=0;
  save();
}
save();
</script>

</body>
</html>
