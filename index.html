<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Aviator RNG Predictor</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1220;
  color:#eaf4ff;
}
header{
  padding:14px;
  text-align:center;
  font-weight:bold;
  background:linear-gradient(90deg,#3bc9ff,#ff4d4d);
}
.container{max-width:600px;margin:auto;padding:15px}
.card{
  background:#121b2f;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
}
button{
  border:none;
  border-radius:6px;
  padding:7px 12px;
  font-weight:bold;
  cursor:pointer;
}
.blue{background:#3bc9ff;color:#001}
.red{background:#ff4d4d;color:#fff}
.pred{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0e1628;
  border-radius:6px;
  padding:8px;
  margin-top:6px;
}
</style>
</head>

<body>

<header>AVIATOR RNG PREDICTOR</header>

<div class="container">

<div class="card">
  <button class="blue" onclick="predict()">ANALYSE</button>
</div>

<div class="card">
  <b>Prédictions</b>
  <div id="preds"></div>
</div>

<div class="card">
  <b>Stats IA</b><br>
  Gagné: <span id="wins">0</span> |
  Perdu: <span id="losses">0</span><br>
  Progression IA: <span id="progress">0</span>%
  <br><br>
  <button class="red" onclick="resetStats()">Reset stats</button>
</div>

</div>

<script>
// ================= SÉCURITÉ =================
function safe(n,def){ return (isNaN(n)||n===undefined)?def:n }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)) }

// ================= IA INIT =================
let IA = JSON.parse(localStorage.getItem("aviatorIA")) || {};
IA.wins     = safe(IA.wins,0);
IA.losses  = safe(IA.losses,0);
IA.wTime   = safe(IA.wTime,1);
IA.wMinute = safe(IA.wMinute,1);
IA.wSecond = safe(IA.wSecond,1);
IA.entropy = safe(IA.entropy,Math.random());

let lastPreds=[];

function save(){
  localStorage.setItem("aviatorIA",JSON.stringify(IA));
  updateUI();
}

// ================= RNG PRO =================
function rng(){
  let d=new Date();
  let h=d.getHours()+1;
  let m=d.getMinutes()+1;
  let s=d.getSeconds()+1;

  let mix =
    h*IA.wTime +
    m*IA.wMinute +
    s*IA.wSecond +
    IA.entropy*100 +
    Math.random()*10;

  return (mix%100)/100;
}

// ================= PREDICTION =================
function predict(){
  lastPreds=[];
  for(let i=0;i<4;i++){
    let r=rng();
    let base=1.4 + r*5;
    let adapt=(IA.wins-IA.losses)*0.02;
    let val=clamp(base+adapt,1.2,50);
    lastPreds.push(val.toFixed(2));
  }
  drawPreds();
}

// ================= AFFICHAGE =================
function drawPreds(){
  let div=document.getElementById("preds");
  div.innerHTML="";
  lastPreds.forEach((p,i)=>{
    div.innerHTML+=`
      <div class="pred">
        <b>${p}x</b>
        <div>
          <button class="blue" onclick="feedback(${i},true)">GAGNÉ</button>
          <button class="red" onclick="feedback(${i},false)">PERDU</button>
        </div>
      </div>
    `;
  });
}

// ================= APPRENTISSAGE IA =================
function feedback(i,win){
  let v=parseFloat(lastPreds[i]);
  if(win){
    IA.wins++;
    IA.wSecond+=0.02;
    IA.entropy+=v*0.002;
  }else{
    IA.losses++;
    IA.wMinute+=0.03;
    IA.entropy-=0.01;
  }
  IA.entropy=clamp(IA.entropy,0.01,1);
  save();
}

// ================= UI =================
function updateUI(){
  document.getElementById("wins").textContent=IA.wins;
  document.getElementById("losses").textContent=IA.losses;
  let total=IA.wins+IA.losses;
  document.getElementById("progress").textContent=
    total?Math.round((IA.wins/total)*100):0;
}

function resetStats(){
  IA.wins=0;
  IA.losses=0;
  save();
}

updateUI();
</script>

</body>
</html>
