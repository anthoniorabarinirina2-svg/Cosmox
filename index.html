<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Master Logic - Ultimate Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --card-bg: rgba(20, 20, 40, 0.9);
            --accent-purple: #8e2de2;
            --btn-pink: linear-gradient(to right, #ff00cc, #3333ff);
            --cyan: #00f2ff;
            --success: #00ff88;
            --danger: #ff0055;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container { width: 100%; max-width: 420px; }

        .header { text-align: center; padding: 20px 0; }
        .header h1 { font-size: 1.5em; margin: 0; letter-spacing: 2px; text-shadow: 0 0 15px var(--accent-purple); }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        h3 { font-size: 0.9em; margin-top: 0; color: var(--cyan); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }

        /* Graphique */
        .chart-container { height: 150px; margin-bottom: 10px; }

        /* Inputs & Buttons */
        select, input {
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0,0,0,0.3); color: white;
        }

        .btn-go {
            width: 100%; padding: 15px; border-radius: 50px; border: none;
            background: var(--btn-pink); color: white; font-weight: bold;
            text-transform: uppercase; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 0, 204, 0.3);
        }

        .scan-zone {
            border: 2px dashed rgba(0, 242, 255, 0.3); border-radius: 15px;
            padding: 20px; text-align: center; background: rgba(0, 242, 255, 0.05); cursor: pointer;
        }

        #verdictDisplay {
            margin-top: 15px; padding: 15px; border-radius: 15px;
            text-align: center; font-weight: bold; font-size: 1.4em; display: none;
        }
        .oui { border: 2px solid var(--success); color: var(--success); background: rgba(0, 255, 136, 0.1); }
        .non { border: 2px solid var(--danger); color: var(--danger); background: rgba(255, 0, 85, 0.1); }

        .footer { font-size: 0.7em; text-align: center; opacity: 0.6; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>AVIATOR MASTER PRO</h1>
        </div>

        <div class="card">
            <h3>📈 Tendance du Serveur</h3>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>📸 Scan Historique</h3>
            <div class="scan-zone" onclick="document.getElementById('fileIn').click()">
                <p style="margin:0; font-size: 0.8em;">Importer capture pour analyse OCR</p>
                <input type="file" id="fileIn" style="display:none" onchange="runAnalysis()">
            </div>
        </div>

        <div class="card">
            <h3>🚦 Confirmateur 2+</h3>
            <input type="time" id="roseTime" onchange="updateMiroir()">
            
            <select id="hashIn">
                <option value="">Fin du dernier Hash ?</option>
                <option value="num">Chiffre (0-9) ✅</option>
                <option value="let">Lettre (a-f) ❌</option>
            </select>

            <select id="colorIn">
                <option value="">Dernier tour ?</option>
                <option value="blue">Bleu (< 2.00x)</option>
                <option value="violet">Violet / Rose (> 2.00x)</option>
            </select>

            <button class="btn-go" onclick="getSignal()">Vérifier le Signal</button>

            <div id="verdictDisplay"></div>
            <div id="miroirInfo" style="text-align:center; font-size:0.8em; margin-top:10px; color:var(--cyan);"></div>
        </div>

        <div class="footer">
            Algorithme v4.0 - Stratégies Combinées<br>
            © 2026 Aviator Master Logic
        </div>
    </div>

    <script>
        // Initialisation du Graphique
        const ctx = document.getElementById('trendChart').getContext('2d');
        const trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['T-5', 'T-4', 'T-3', 'T-2', 'T-1', 'Now'],
                datasets: [{
                    label: 'Force du Cycle',
                    data: [1.2, 4.5, 1.1, 2.3, 1.0, 1.8],
                    borderColor: '#00f2ff',
                    backgroundColor: 'rgba(0, 242, 255, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { ticks: { color: '#5c6b7e' } } } }
        });

        function updateMiroir() {
            let t = document.getElementById('roseTime').value;
            let [h, m] = t.split(':');
            let next = ((parseInt(h) + 1) % 24).toString().padStart(2, '0') + ":" + m;
            document.getElementById('miroirInfo').innerHTML = "🎯 Fenêtre Miroir Cible : " + next + "";
        }

        function getSignal() {
            const h = document.getElementById('hashIn').value;
            const c = document.getElementById('colorIn').value;
            const disp = document.getElementById('verdictDisplay');

            disp.style.display = "block";

            // LOGIQUE 2+ : BLEU + CHIFFRE
            if (c === "blue" && h === "num") {
                disp.innerHTML = "OUI - MISE !";
                disp.className = "oui";
                // Animation du graphique vers le haut
                trendChart.data.datasets[0].data.push(8.5);
                trendChart.data.datasets[0].data.shift();
                trendChart.update();
            } else {
                disp.innerHTML = "NON - ATTENDS";
                disp.className = "non";
                trendChart.data.datasets[0].data.push(1.0);
                trendChart.data.datasets[0].data.shift();
                trendChart.update();
            }
        }

        function runAnalysis() {
            alert("Analyse OCR en cours sur les cycles miroirs...");
        }
    </script>
</body>
</html>
