<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Aviator RNG Predictor</title>
<style>
body{
  background:#0b1220;
  color:#eaf4ff;
  font-family:Arial,Helvetica,sans-serif;
  margin:0;
}
header{
  background:linear-gradient(90deg,#3bc9ff,#ff4d4d);
  padding:15px;
  text-align:center;
  font-weight:bold;
}
.container{padding:15px;max-width:600px;margin:auto}
.card{
  background:#121b2f;
  border-radius:8px;
  padding:15px;
  margin-bottom:15px;
}
button{
  padding:8px 12px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}
.blue{background:#3bc9ff;color:#001}
.red{background:#ff4d4d;color:#fff}
.pred{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0e1628;
  padding:8px;
  border-radius:5px;
  margin:6px 0;
}
.small{font-size:12px;opacity:.8}
</style>
</head>

<body>

<header>AVIATOR RNG PREDICTOR</header>

<div class="container">

<div class="card">
  <button class="blue" onclick="predict()">ANALYSE</button>
</div>

<div class="card">
  <b>Prédictions</b>
  <div id="preds"></div>
</div>

<div class="card">
  <b>Stats IA</b><br>
  Gagné: <span id="wins">0</span> |
  Perdu: <span id="losses">0</span><br>
  Progression IA: <span id="progress">0</span>%
  <br><br>
  <button class="red" onclick="resetStats()">Reset stats</button>
</div>

</div>

<script>
// ================= IA STATE =================
let IA = JSON.parse(localStorage.getItem("aviatorIA")) || {
  wins:0,
  losses:0,
  wTime:1,
  wMinute:1,
  wSecond:1,
  entropy:Math.random()
};

let lastPreds = [];

function save(){
  localStorage.setItem("aviatorIA",JSON.stringify(IA));
  updateUI();
}

function clamp(v,min,max){return v<min?min:v>max?max:v}

// ================= RNG PRO =================
function rng(){
  let d=new Date();
  let t=d.getHours()*IA.wTime;
  let m=d.getMinutes()*IA.wMinute;
  let s=d.getSeconds()*IA.wSecond;
  let noise=Math.random()+IA.entropy;
  return (t+m+s+noise)%1;
}

// ================= PREDICT =================
function predict(){
  lastPreds=[];
  for(let i=0;i<4;i++){
    let r=rng();
    let base=1.5+r*4;
    let adj=(IA.wins-IA.losses)*0.01;
    let val=clamp(base+adj,1.2,20);
    lastPreds.push(val.toFixed(2));
  }
  drawPreds();
}

// ================= DISPLAY =================
function drawPreds(){
  let div=document.getElementById("preds");
  div.innerHTML="";
  lastPreds.forEach((p,i)=>{
    div.innerHTML+=`
      <div class="pred">
        <span>${p}x</span>
        <div>
          <button class="blue" onclick="feedback(${i},true)">GAGNÉ</button>
          <button class="red" onclick="feedback(${i},false)">PERDU</button>
        </div>
      </div>
    `;
  });
}

// ================= FEEDBACK IA =================
function feedback(i,win){
  let v=parseFloat(lastPreds[i]);
  if(win){
    IA.wins++;
    IA.wSecond+=0.01;
    IA.entropy+=v*0.001;
  }else{
    IA.losses++;
    IA.wMinute+=0.015;
    IA.entropy-=0.002;
  }
  IA.entropy=clamp(IA.entropy,0,1);
  save();
}

// ================= UI =================
function updateUI(){
  document.getElementById("wins").textContent=IA.wins;
  document.getElementById("losses").textContent=IA.losses;
  let total=IA.wins+IA.losses;
  let prog=total?Math.round((IA.wins/total)*100):0;
  document.getElementById("progress").textContent=prog;
}

function resetStats(){
  IA.wins=0;
  IA.losses=0;
  save();
}

updateUI();
</script>

</body>
</html>
