<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AVIATOR IA MAX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
 --blue:#6ecbff;
 --red:#ff4b4b;
 --bg:#060b18;
}
*{box-sizing:border-box;font-family:Arial}
body{
 margin:0;
 background:
 linear-gradient(rgba(6,11,24,.92),rgba(6,11,24,.92)),
 url("https://wallpapercave.com/wp/wp8355542.jpg");
 background-size:cover;
 color:white;
}
header{text-align:center;padding:14px}
.progress{height:8px;background:#222;border-radius:8px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--red))}
.box{background:rgba(255,255,255,.1);padding:14px;border-radius:18px;margin:12px}
input,button{width:100%;padding:12px;border-radius:12px;border:none;margin-top:6px}
.blue{background:var(--blue)}
.red{background:var(--red)}
.green{background:#2ecc71}
.card{background:white;color:black;border-radius:22px;padding:18px;text-align:center}
.hidden{display:none}
</style>
</head>

<body>

<header>
<h2>AVIATOR IA MAX</h2>
<div class="progress"><span id="iaBar"></span></div>
<p>
IA: <b><span id="iaLevel">0</span>%</b> |
Gagné: <span id="win">0</span> |
Perdu: <span id="lose">0</span>
</p>
</header>

<section id="login" class="box">
<input id="user" placeholder="Pseudo">
<input id="pass" placeholder="Mot de passe">
<button class="blue" onclick="login()">Connexion</button>
</section>

<section id="home" class="hidden">
<div class="card">
<h3>AVIATOR PREDICTOR</h3>
<p>IA mathématique adaptative</p>
<button class="blue" onclick="openIA()">Accéder</button>
</div>

<div class="box">
<h4>Membres</h4>
<div id="members"></div>
</div>
</section>

<section id="ia" class="hidden">
<div class="box">
<input id="h" placeholder="Heure du rose">
<input id="m" placeholder="Minute">
<input id="s" placeholder="Seconde">
<input id="c" placeholder="Cote rose">
<button class="blue" onclick="analyse()">ANALYSER</button>
</div>

<div class="box">
<div id="result">---</div>
<button class="green" onclick="feedback(true)">GAGNÉ</button>
<button class="red" onclick="feedback(false)">PERDU</button>
</div>
</section>

<script>
let DB = JSON.parse(localStorage.getItem("AVIATOR_DB")) || {
 admin:{pass:"admin"},
 users:{},
 ia:{win:0,lose:0,level:0}
};
function save(){localStorage.setItem("AVIATOR_DB",JSON.stringify(DB))}

function login(){
 let u=user.value,p=pass.value;
 if(u==="admin" && p===DB.admin.pass){
  login.style.display="none";
  home.classList.remove("hidden");
  loadMembers();
  return;
 }
 if(DB.users[u] && DB.users[u].pass===p && DB.users[u].ok){
  login.style.display="none";
  home.classList.remove("hidden");
 }else{
  if(!DB.users[u]){
   DB.users[u]={pass:p,ok:false};
   save();
   alert("Compte en attente validation admin");
  }else alert("Accès refusé");
 }
}

function loadMembers(){
 members.innerHTML="";
 for(let u in DB.users){
  members.innerHTML+=`
   ${u} - ${DB.users[u].ok?"✅":"⏳"}
   <button onclick="approve('${u}')">OK</button><br>`;
 }
}
function approve(u){
 DB.users[u].ok=true; save(); loadMembers();
}

function openIA(){
 home.classList.add("hidden");
 ia.classList.remove("hidden");
}

function analyse(){
 let h1=+h.value,m1=+m.value,s1=+s.value,c1=+c.value;
 let math =
  Math.abs(
   Math.sin(h1*2.7)+
   Math.cos(m1*1.9)+
   Math.tan((s1+1)/60)+
   Math.log(c1+1)*4
  )*10;
 let min=(math%3+2).toFixed(2);
 let max=(math%7+5).toFixed(2);
 result.innerHTML=`
 📊 Entrée estimée: ${m1}:${(s1+25)%60}<br>
 📉 Cote min: ${min}x<br>
 📈 Cote max: ${max}x`;
}

function feedback(win){
 win?DB.ia.win++:DB.ia.lose++;
 let t=DB.ia.win+DB.ia.lose;
 DB.ia.level=Math.min(100,Math.floor(DB.ia.win/t*100));
 document.getElementById("win").innerText=DB.ia.win;
 document.getElementById("lose").innerText=DB.ia.lose;
 iaBar.style.width=DB.ia.level+"%";
 iaLevel.innerText=DB.ia.level;
 save();
}
</script>

</body>
</html>
